<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coin Catcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>🪙 Coin Catcher</h1>
      <p class="subtitle">A tiny educational game — not a real wallet, not real Bitcoin.</p>
    </header>

    <section class="card game-card">
      <div class="hud">
        <span>Score: <strong id="score">0</strong></span>
        <span>Lives: <strong id="lives">3</strong></span>
      </div>

      <div class="game-wrap">
        <canvas id="game-canvas" width="480" height="360"
          aria-label="Coin Catcher game canvas">
        </canvas>

        <div class="overlay" id="start-overlay">
          <h2>Ready?</h2>
          <p>Move the basket with ← → and catch the falling coins. Avoid the bombs.</p>
          <button id="start-btn" type="button">Start Game</button>
        </div>

        <div class="overlay" id="game-over-overlay" hidden>
          <h2>Game Over</h2>
          <p>Final score: <strong id="final-score">0</strong></p>
          <button id="restart-btn" type="button">Play Again</button>
        </div>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
  </main>

    <script src="game-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
