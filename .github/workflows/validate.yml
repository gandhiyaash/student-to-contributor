name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node .github/scripts/check-js-syntax.js

  html-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML validity
        run: node .github/scripts/check-html.js

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown files
        run: node .github/scripts/check-markdown.js

  contributors-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate student contributor files
        run: node .github/scripts/check-contributors.js
